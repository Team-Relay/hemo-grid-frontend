name: Frontend verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEMOGRID_API_URL: http://127.0.0.1:8080/api/v1
      NEXT_PUBLIC_HEMOGRID_API_URL: http://127.0.0.1:8080/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Validate controlled synthetic lifecycle syntax
        run: node --check scripts/controlled-live-lifecycle.mjs
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
